<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalCalcu | 음식 사진 칼로리 추정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/style.css?v=1" rel="stylesheet">
</head>
<body>
  <!--
    AI EDIT NOTE:
    앞으로 이 파일을 수정할 때마다 초보자도 이해할 수 있도록
    주요 섹션/블록에 설명 주석을 자세히 추가·유지하세요.
  -->
  <!-- 배경 분위기를 위한 장식 레이어 (콘텐츠와 분리) -->
  <div class="ambient"></div>
  <!-- 페이지의 메인 콘텐츠 컨테이너 -->
  <main class="shell">
    <!-- 상단 안내 영역: 서비스 소개 -->
    <header class="hero">
      <span class="badge">Food Vision Lab</span>
      <h1>칼로리 추정</h1>
    </header>

    <!-- 업로드/분석 조작 패널 -->
    <section class="panel">
      <!-- 패널 헤더: 제목 + 현재 상태 표시 -->
      <div class="panel__top">
        <div>
          <h2>사진 업로드</h2>
          <p>카메라 촬영 또는 파일을 선택하세요.</p>
        </div>
        <div class="status" id="statusText">준비 완료</div>
      </div>

      <!-- 주요 컨트롤 버튼들 -->
      <div class="controls">
        <!-- 파일 선택: 카메라 촬영 또는 앨범에서 선택 -->
        <label class="btn btn--primary" for="imageInput">
          <input id="imageInput" type="file" accept="image/*" />
          사진 촬영/업로드
        </label>
        <!-- 선택 취소/초기화 -->
        <button class="btn btn--ghost" id="resetBtn" type="button">다시 선택</button>
        <!-- 분석 요청: 이미지가 있을 때만 활성화 -->
        <button class="btn btn--accent" id="analyzeBtn" type="button" disabled>분석 시작</button>
      </div>

      <!-- 이미지 미리보기 -->
      <div class="preview">
        <img id="previewImage" alt="선택한 음식 사진 미리보기" />
        <div class="preview__placeholder">
          <div class="preview__icon"></div>
          <p>선택한 사진이 여기에 표시됩니다.</p>
        </div>
      </div>

      <!-- 로딩/에러 피드백 영역 -->
      <div class="feedback">
        <div class="loading" id="loading" hidden>
          <span class="spinner"></span>
          분석 중입니다. 잠시만 기다려주세요.
        </div>
        <div class="error" id="error" hidden></div>
      </div>
    </section>

    <!-- 분석 결과 카드 -->
    <section class="result">
      <calorie-result id="resultCard" hidden></calorie-result>
      <p class="disclaimer">추정치이며 실제와 오차가 있을 수 있음</p>
    </section>
  </main>

  <script defer type="module" src="/main.js?v=1"></script>
</body>
</html>
